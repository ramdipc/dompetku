# Upload folder frontend/ ke GitHub Pages setiap ada perubahan di branch main.
# Aktifkan dulu: repo Settings > Pages > Source: "GitHub Actions"
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek config.js sudah diisi
        run: |
          URL=$(grep -oE "SUPABASE_URL: *'[^']*'" frontend/js/config.js | sed -E "s/.*'(.*)'/\1/")
          KEY=$(grep -oE "SUPABASE_KEY: *'[^']*'" frontend/js/config.js | sed -E "s/.*'(.*)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ] || echo "$URL$KEY" | grep -q "XXXXXXXXXXXX\|GANTI_DENGAN"; then
            echo "::error::frontend/js/config.js belum diisi SUPABASE_URL & SUPABASE_KEY. Lihat README Langkah 3."
            exit 1
          fi
          case "$KEY" in
            sb_secret_*)
              echo "::error::SUPABASE_KEY berisi secret key! Ganti dengan publishable key (sb_publishable_...)."
              exit 1 ;;
            eyJ*)
              ROLE=$(echo "$KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | grep -o '"role":"[^"]*"' || true)
              if echo "$ROLE" | grep -q service_role; then
                echo "::error::SUPABASE_KEY berisi service_role key! Ganti dengan publishable/anon key."
                exit 1
              fi ;;
          esac
          echo "config.js OK: $URL"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
