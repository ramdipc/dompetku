# Supabase paket gratis mem-pause project yang tidak aktif 7 hari.
# Workflow ini "menyapa" database tiap 3 hari supaya tetap aktif.
# Tidak perlu secret: URL & publishable key dibaca dari frontend/js/config.js.
name: Jaga Supabase tetap aktif

on:
  schedule:
    - cron: '17 1 */3 * *'   # jam 08:17 WIB, tiap 3 hari
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping database
        run: |
          node --input-type=module -e "
            import { CONFIG } from './frontend/js/config.js';
            const url = CONFIG.SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/rpc/ping';
            const res = await fetch(url, { method: 'POST',
              headers: { apikey: CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' }, body: '{}' });
            const teks = await res.text();
            console.log('Status', res.status, teks);
            if (!res.ok) { console.error('Ping gagal. Jika project ter-pause, buka dashboard Supabase lalu Restore.'); process.exit(1); }
          "
